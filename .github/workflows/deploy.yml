name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 51.195.148.206
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Deploy started ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            ls -la /var/www/groundhopper/
            rsync -avz --delete dist/ /var/www/groundhopper/
            echo "=== Deploy finished ==="
            ls -la /var/www/groundhopper/